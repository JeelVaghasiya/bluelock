# Playbook: condition -> action -> rationale -> policy -> rollback.
# Every sentence the UI shows for "why" and "what to do" comes from here, so each
# recommendation traces to a rule and to the signals that matched it.
rules:
  - id: upstream_link_degradation
    when: {root_kind: link, root_metrics_any: [rtt, loss, jitter, up], impacted_metrics_any: [error_rate, up, rtt]}
    action:
      key: failover_uplink
      text: "Check link {root} or fail over to the secondary uplink"
      reversible: true
      rollback_key: failback_uplink
      requires_role: tenant-admin
      max_blast_radius: 6
    why: "Link {root} {metric} rose {lead_s}s before {impacted_n} dependent component(s) degraded"

  - id: link_down
    when: {root_kind: link, root_metrics_any: [up, loss]}
    action:
      key: failover_uplink
      text: "Link {root} is down - fail over to the secondary uplink"
      reversible: true
      rollback_key: failback_uplink
      requires_role: tenant-admin
      max_blast_radius: 6
    why: "Probe success on {root} dropped to {value} while loss rose"

  - id: memory_leak
    when: {root_kind: host, root_metrics_any: [mem], trend: rising}
    action:
      key: restart_service
      text: "Restart the leaking service on {root} during low traffic"
      reversible: true
      rollback_key: none
      requires_role: tenant-admin
      max_blast_radius: 3
    why: "Memory on {root} has risen steadily for {duration_s}s and left its learned baseline (z={z})"

  - id: cpu_saturation
    when: {root_kind: host, root_metrics_any: [cpu]}
    action:
      key: scale_out
      text: "Shift load away from {root} or add capacity"
      reversible: true
      rollback_key: scale_in
      requires_role: tenant-admin
      max_blast_radius: 4
    why: "CPU p95 on {root} is {value}% against a baseline of {baseline}% (z={z})"

  - id: disk_fill
    when: {root_kind: host, root_metrics_any: [disk, disk_hours_to_full]}
    action:
      key: rotate_logs
      text: "Rotate and compress logs on {root}; disk is projected full in {hours_to_full}h"
      reversible: false
      rollback_key: none
      requires_role: tenant-admin
      max_blast_radius: 1
    why: "Disk usage on {root} is rising linearly"

  - id: login_flood
    when: {categories_any: [auth], patterns_any: [login_flood]}
    action:
      key: enable_auth_rate_limit
      text: "Turn on gateway login rate-limiting (fail2ban-style jail) - blocking single IPs cannot stop a distributed flood"
      reversible: true
      rollback_key: disable_auth_rate_limit
      requires_role: tenant-admin
      max_blast_radius: 500
    why: "{fail_count} failed logins in {window_s}s across {distinct_users} accounts from many sources ({value}/s, above the site flood threshold)"

  - id: auth_attack
    when: {categories_any: [auth]}
    action:
      key: block_source_ip
      text: "Block source {root} at the gateway for 1 hour and force a password reset for targeted accounts"
      reversible: true
      rollback_key: unblock_source_ip
      requires_role: tenant-admin
      max_blast_radius: 1
    why: "{fail_count} failed logins across {distinct_users} accounts from {root} in {window_s}s ({pattern})"

  - id: storage_degradation
    when: {root_kind: device, root_metrics_any: [io_latency, queue_depth, capacity]}
    action:
      key: failover_device
      text: "Move I/O on {root} to the replica array and check its disks/controllers"
      reversible: true
      rollback_key: failback_device
      requires_role: tenant-admin
      max_blast_radius: 8
    why: "Storage {root} {metric} rose to {value} before {impacted_n} dependent component(s) slowed down"

  - id: network_device_errors
    when: {root_kind: device, root_metrics_any: [if_errors, drops, net_util]}
    action:
      key: failover_device
      text: "Shift traffic off {root} to its redundant peer and check the flapping port"
      reversible: true
      rollback_key: failback_device
      requires_role: tenant-admin
      max_blast_radius: 8
    why: "Network device {root} {metric} rose to {value}; {impacted_n} service(s) routed through it degraded"

  - id: db_replication_lag
    when: {root_kind: svc, root_metrics_any: [repl_lag]}
    action:
      key: restart_service
      text: "Check the replica of {root}: restart replication and look for long-running transactions"
      reversible: true
      rollback_key: none
      requires_role: tenant-admin
      max_blast_radius: 4
    why: "Replication lag on {root} reached {value} against a baseline of {baseline}"

  - id: cache_degradation
    when: {root_kind: svc, root_metrics_any: [cache_hit, evictions]}
    action:
      key: scale_out
      text: "Add cache capacity for {root} or warm it; misses are falling through to the database"
      reversible: true
      rollback_key: scale_in
      requires_role: tenant-admin
      max_blast_radius: 4
    why: "Hit ratio on {root} fell to {value} against a baseline of {baseline}"

  - id: queue_backlog
    when: {root_kind: svc, root_metrics_any: [queue_depth, consumer_lag]}
    action:
      key: scale_out
      text: "Add consumers for {root}; the backlog is growing faster than it drains"
      reversible: true
      rollback_key: scale_in
      requires_role: tenant-admin
      max_blast_radius: 4
    why: "{root} {metric} climbed to {value} against a baseline of {baseline}"

  - id: service_errors
    when: {root_kind: svc, root_metrics_any: [error_rate, up]}
    action:
      key: restart_service
      text: "Restart service {root} and check its recent deploys"
      reversible: true
      rollback_key: none
      requires_role: tenant-admin
      max_blast_radius: 4
    why: "Errors on {root} rose to {value} against a baseline of {baseline}, with no upstream cause found"

  - id: generic_anomaly
    when: {}
    action:
      key: investigate
      text: "Investigate {root}: behaviour deviates from its learned baseline"
      reversible: true
      rollback_key: none
      requires_role: tenant-viewer
      max_blast_radius: 99
      execute: false
    why: "{layers} flagged {root} as unusual"
