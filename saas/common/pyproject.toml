[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tl-common"
version = "1.0.0"
description = "TrustLine SaaS shared helpers: tenant-scoped DB access, NATS, registry, config"
requires-python = ">=3.12"
dependencies = ["asyncpg==0.32.0", "nats-py==2.17.0", "PyYAML==6.0.3", "orjson==3.13.0"]

[tool.setuptools]
packages = ["tl_common"]
